approach:
  eyebrow: Delivery method
  title: Practical steps that slot into your operation
  detail_title: How it works
  highlight: On-site, remote, or hybrid delivery with clear milestones, risk
    controls, and production-ready testing.
  steps:
    - number: "01"
      title: Discover
      summary: Complimentary assessments reveal automation opportunities.
      description: Free assessments covering alarm floods, loop health, instrument
        reliability, and HMI usability to target quick wins.
    - number: "02"
      title: Define scope
      summary: We specify, design, and document a business-backed solution.
      description: Scope, P&IDs, risk controls, and phased plans that balance
        production windows with business-backed outcomes.
    - number: "03"
      title: Plan & deliver
      summary: Co-develop, test, and implement optimized control strategies.
      description: Co-develop, test, and commission upgrades with operators
        involved-no surprises for control room or field teams.
    - number: "04"
      title: Review & finalize
      summary: Compare performance, document outcomes, and transfer knowledge.
      description: Compare before/after KPIs, lock in procedures, and transfer
        knowledge so crews own the improvement.
team:
  eyebrow: Our team
  title: Automation, electrical, AI and data specialists with proven experience in
    complex mining environments. Make it bold like title
  text: Automation, electrical, and data specialists with wins in complex mining
    environments.
  members:
    - initials: BL
      name: Badraa Lkhagvaa
      role: Co-founder - Automation Engineer
      bio: 15+ years leading industrial and mining automation, specializing in DeltaV
        DCS, process control, and continuous improvement.
      details: Optimization at Oyu Tolgoi (Mongolia) and Kennecott Utah Copper (USA).
        Degree in Automation of Technological Processes and Production from Ural
        State Mining University.
    - initials: IG
      name: Ider Gerelsuren
      role: Co-founder - Electrical & Automation Engineer
      bio: 8+ years across industrial automation, maintenance, and asset management
        with deep PLC, instrumentation, and DeltaV expertise.
      details: Focused on MV/LV systems, safety, and operational readiness. Degree in
        Industrial Automation from Mongolian University of Science and
        Technology.
    - initials: TB
      name: Tsogt Batjargal
      role: Industrial Data & System Engineer
      bio: 15+ years in IT and data analytics, building reliable, integrated data
        systems that give teams one version of the truth.
      details: Industrial data operations in mining companies. Degrees from NUM, Data
        Analytics, and Computer Programming.
    - initials: ZT
      name: Zulkhuu Tuya
      role: AI and Computer Vision Engineer
      bio: AI and computer vision engineer with over a decade of experience across
        robotics, 3D vision, sensor calibration, embedded systems, and machine
        learning. His work spans 3D reconstruction, multi-sensor registration,
        ROS-based robotics, localization, embedded vision optimization, image
        and video processing. With industry experience at Sony, Kailas Robotics,
        and startup ventures, he brings deep technical expertise in making
        cameras see, understand, and measure the physical world.
