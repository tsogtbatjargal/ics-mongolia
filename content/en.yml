ai_solutions:
  eyebrow: Flagship product
  title: See ICS-FOD running on a live conveyor
  intro: ICS builds custom computer vision solutions that help mining operations
    improve safety, reduce downtime, and automate visual inspection across the
    entire extraction process. Our models are trained on mining-specific data
    and built to perform in harsh mining environments.
  product:
    name: ICS-FOD
    tagline: Foreign Object Detection System
    logo: /images/ics-fod-logo.png
    logo_alt: ICS-FOD logo
    image: /images/ics-fod-product.png
    image_alt: ICS-FOD live foreign-object-detection user interface
    video: /images/ics-fod-demo.mp4
    video_poster: /images/ics-fod-product.webp
    video_caption: ICS-FOD detecting foreign objects on a live conveyor feed.
    description: The ICS-FOD is an AI system that provides continuous, real-time
      detection of foreign objects on conveyor belts in mining and mineral
      processing operations. By combining an AI engine, embedded computing
      device, industrial-grade camera, and a configurable alarm and integration
      platform, ICS-FOD identifies hazardous objects before they reach critical
      downstream equipment — preventing costly belt damage, equipment failures,
      and unplanned production downtime.
    features:
      - title: Deep Learning Vision
        text: Detects ferrous & non-ferrous tramp metal and oversized objects — classes
          missed by conventional metal detectors.
      - title: < 1s Latency
        text: From object entering camera FOV to alarm output — instant belt stop on
          confirmed detection.
      - title: 24 / 7 Monitoring
        text: No blind spots between inspections. Operates overnight and during shift
          changes with no operator input.
    page_cta_label: Full specifications
    page_cta_url: /en/products/ics-fod/
    product_page:
      meta_title: ICS-FOD — Foreign Object Detection System | ICS Mongolia
      meta_description: AI-powered foreign object detection for mining conveyor belts —
        deep learning vision, under 1 second latency, 24/7 monitoring.
      hero_eyebrow: AI Solutions — ICS-FOD
      hero_title: Foreign Object Detection for mining conveyor belts
      hero_lede: Continuous, real-time detection of foreign objects on conveyor belts in
        mining and mineral processing operations — preventing costly belt damage,
        equipment failures, and unplanned production downtime.
      primary_cta:
        label: Request a demo
        url: /en/#contact
      secondary_cta:
        label: View specifications
        url: "#specs"
      intro_eyebrow: What it does
      intro_title: An AI engine, camera, and alarm system in one platform
      specs_eyebrow: Specifications
      specs_title: What's in the system
      specs_text: A closer look at the platform described above.
      specs:
        - label: Detection method
          value: Deep-learning computer vision (custom-trained on mining-specific data)
        - label: Object classes
          value: Ferrous & non-ferrous tramp metal, oversized objects
        - label: Response latency
          value: "< 1 second from object entering camera field of view to alarm output"
        - label: Operating schedule
          value: 24/7 — including overnight and shift changes, no operator input required
        - label: Hardware
          value: Embedded computing device + industrial-grade camera
        - label: Integration
          value: Configurable alarm and integration platform (belt-stop interlock)
      how_it_works_eyebrow: How it works
      how_it_works_title: From detection to belt stop
      how_it_works:
        - title: Camera watches the belt
          text: The industrial-grade camera continuously monitors the conveyor line,
            feeding video to the embedded AI engine.
        - title: AI classifies objects in real time
          text: The deep-learning model, trained on mining-specific data, identifies
            tramp metal and oversized objects as they enter the frame.
        - title: Alarm fires in under a second
          text: On confirmed detection, the configurable alarm and integration platform
            triggers — including an instant belt stop.
        - title: Downstream equipment is protected
          text: Hazardous objects are caught before reaching critical downstream
            equipment, preventing belt damage and unplanned downtime.
      contact_eyebrow: Get in touch
      contact_title: See ICS-FOD on your operation
      contact_text: Talk to the team about fitting ICS-FOD to your conveyor lines.
      contact_cta_label: Contact us
      back_to_home_label: Back to homepage
approach:
  eyebrow: Delivery method
  title: Practical steps that slot into your operation
  detail_title: How it works
  highlight: On-site, remote, or hybrid delivery with clear milestones, risk
    controls, and production-ready testing.
  steps:
    - number: "01"
      title: Discover
      summary: Complimentary assessments reveal automation opportunities.
      description: Free assessments covering alarm floods, loop health, instrument
        reliability, and HMI usability to target quick wins.
    - number: "02"
      title: Define scope
      summary: We specify, design, and document a business-backed solution.
      description: Scope, P&IDs, risk controls, and phased plans that balance
        production windows with business-backed outcomes.
    - number: "03"
      title: Plan & deliver
      summary: Co-develop, test, and implement optimized control strategies.
      description: Co-develop, test, and commission upgrades with operators involved —
        no surprises for control room or field teams.
    - number: "04"
      title: Review & finalize
      summary: Compare performance, document outcomes, and transfer knowledge.
      description: Compare before/after KPIs, lock in procedures, and transfer
        knowledge so crews own the improvement.
