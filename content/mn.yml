services:
  eyebrow: Шийдлүүд
  title: Үйлдвэрлэлийн орчинд зориулсан туршлагад үндэслэсэн үйлчилгээ
  text: Бид байгууллага бүрийн үйл ажиллагаанд тохирсон автоматжуулалт, удирдлагын
    систем, хиймэл оюуны шийдлүүдийг санал болгодог. Олон улсын болон Монголын
    уул уурхайн салбарт ажилласан 16 гаруй жилийн туршлага дээр тулгуурлан
    үйлдвэрлэлийн салбар дахь байгууллагуудад шаардлагатай дэмжлэгийг түргэн
    шуурхай үзүүлж, найдвартай бодит үр дүнг санал болгохоос гадна урт хугацааны
    тогтвортой харилцаагаар ханган ажиллаж байна.
  items:
    - icon: CS
      title: Удирдлагын системийн оновчлол
      text: DeltaV, PLC болон SCADA системийн хараат бус үнэлгээ хийж, үйлдвэрлэлийг
        хамгаалах эрэмбэлсэн засварын төлөвлөгөө боловсруулна.
      tags:
        - Найдвартай байдал
        - Аюулгүй байдал
    - icon: PC
      title: Үйлдвэрлэлийн процессын удирдлагын логик боловсруулах
      text: Бизнесийн үндэслэлтэй удирдлагын өгүүлэмж, P&ID шинэчлэл, шаталсан
        CAPEX/OPEX зөвлөмж.
      tags:
        - ROI эхэнд
        - Эрэмбэлсэн
    - icon: AC
      title: PID контроллёрын тохируулга ба процессын тогтвортой байдлыг сайжруулах
      text: PID тохируулга, APC, хамгаалалтын холбоосоор хэлхээг тогтворжуулж зогсолт
        ба гар ажиллагааг бууруулна.
      tags:
        - APC
        - Контур тохируулга
    - icon: AH
      title: Дохиолол ба HMI шинэчлэл
      text: ISA-18.2 дохиоллын стратеги, үүрэгт суурилсан HMI, ослоос хамгаалах
        ажиллагааны журам.
      tags:
        - ISA-18.2
        - Операторууд
    - icon: IL
      title: Хэмжүүрийн ашиглалтын мөчлөг
      text: Чухал мэдрэгчүүдийг зураг төслийн хязгаарт барих сонголт, тохируулга,
