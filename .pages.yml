media:
  - name: images
    label: Images
    input: images
    output: /images
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif, svg]
    rename: safe

components:
  link:
    type: object
    fields:
      - name: label
        label: Label
        type: string
        required: true
      - name: url
        label: URL
        type: string
        required: true

  cta:
    type: object
    fields:
      - name: label
        label: Label
        type: string
        required: true
      - name: url
        label: URL
        type: string
        required: true

  hero_stat:
    type: object
    fields:
      - name: value
        label: Value
        type: string
        required: true
      - name: text
        label: Text
        type: text
        required: true

  service:
    type: object
    fields:
      - name: icon
        label: Icon letters
        type: string
        required: true
      - name: title
        label: Title
        type: string
        required: true
      - name: text
        label: Text
        type: text
        required: true
      - name: tags
        label: Tags
        type: string
        list: true

  ai_feature:
    type: object
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: text
        label: Text
        type: text
        required: true

  spec_item:
    type: object
    fields:
      - name: label
        label: Label
        type: string
        required: true
      - name: value
        label: Value
        type: text
        required: true

  how_it_works_item:
    type: object
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: text
        label: Text
        type: text
        required: true

  product_page:
    type: object
    fields:
      - name: meta_title
        label: Page <title>
        type: string
      - name: meta_description
        label: Meta description
        type: text
      - name: hero_eyebrow
        label: Hero eyebrow
        type: string
      - name: hero_title
        label: Hero title
        type: string
      - name: hero_lede
        label: Hero lead text
        type: text
      - name: primary_cta
        label: Primary CTA
        component: cta
      - name: secondary_cta
        label: Secondary CTA
        component: cta
      - name: intro_eyebrow
        label: Intro eyebrow
        type: string
      - name: intro_title
        label: Intro title
        type: string
      - name: specs_eyebrow
        label: Specs eyebrow
        type: string
      - name: specs_title
        label: Specs title
        type: string
      - name: specs_text
        label: Specs intro text
        type: text
      - name: specs
        label: Specifications
        component: spec_item
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
      - name: how_it_works_eyebrow
        label: How-it-works eyebrow
        type: string
      - name: how_it_works_title
        label: How-it-works title
        type: string
      - name: how_it_works
        label: How-it-works steps
        component: how_it_works_item
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
      - name: contact_eyebrow
        label: Contact CTA eyebrow
        type: string
      - name: contact_title
        label: Contact CTA title
        type: string
      - name: contact_text
        label: Contact CTA text
        type: text
      - name: contact_cta_label
        label: Contact CTA button label
        type: string
      - name: back_to_home_label
        label: "Back to homepage link label"
        type: string

  case_study:
    type: object
    fields:
      - name: category
        label: Project type
        type: string
        required: true
      - name: client
        label: Client (name or anonymized description)
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: stat_1_value
        label: Stat 1 value
        type: string
      - name: stat_1_label
        label: Stat 1 label
        type: string
      - name: stat_2_value
        label: Stat 2 value
        type: string
      - name: stat_2_label
        label: Stat 2 label
        type: string

  testimonial:
    type: object
    fields:
      - name: quote
        label: Quote
        type: text
        required: true
      - name: name
        label: Client name
        type: string
        required: true
      - name: role
        label: Title, company
        type: string

  results_section:
    type: object
    fields:
      - name: enabled
        label: Show this section on the live site
        description: Uncheck to hide "Results and what clients say" (and its nav link)
          from both languages without deleting the content below. Re-check and publish
          to bring it back.
        type: boolean
        default: true
      - name: eyebrow
        label: Eyebrow
        type: string
      - name: title
        label: Title
        type: string
      - name: text
        label: Text
        type: text
      - name: case_studies_title
        label: Case studies title
        type: string
      - name: case_studies_text
        label: Case studies intro text
        type: text
      - name: case_studies
        label: Case studies
        component: case_study
        list:
          collapsible:
            collapsed: true
            summary: "{client}"
      - name: testimonials_title
        label: Testimonials title
        type: string
      - name: testimonials_text
        label: Testimonials intro text
        type: text
      - name: testimonials
        label: Testimonials
        component: testimonial
        list:
          collapsible:
            collapsed: true
            summary: "{name}"

  contact_form:
    type: object
    fields:
      - name: title
        label: Form title
        type: string
      - name: name_label
        label: Name field label
        type: string
      - name: name_placeholder
        label: Name field placeholder
        type: string
      - name: email_label
        label: Email field label
        type: string
      - name: email_placeholder
        label: Email field placeholder
        type: string
      - name: company_label
        label: Company field label
        type: string
      - name: company_placeholder
        label: Company field placeholder
        type: string
      - name: message_label
        label: Message field label
        type: string
      - name: message_placeholder
        label: Message field placeholder
        type: string
      - name: submit_label
        label: Submit button label
        type: string
      - name: note
        label: Note under the form
        type: text

  approach_step:
    type: object
    fields:
      - name: number
        label: Number
        type: string
        required: true
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
        required: true
      - name: description
        label: Detail description
        type: text
        required: true

  team_member:
    type: object
    fields:
      - name: initials
        label: Initials
        type: string
        required: true
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: string
        required: true
      - name: bio
        label: Bio
        type: text
        required: true
      - name: details
        label: Details
        type: text

  contact_person:
    type: object
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: email
        label: Email
        type: string
        required: true
      - name: phone
        label: Phone
        type: string

  language:
    type: object
    fields:
      - name: code
        label: Code
        type: string
        required: true
      - name: label
        label: Label
        type: string
        required: true
      - name: alternate_label
        label: Alternate language label
        type: string
      - name: alternate_url
        label: Alternate language URL
        type: string

  company:
    type: object
    fields:
      - name: name
        label: Legal name
        type: string
        required: true
      - name: short_name
        label: Short name
        type: string
        required: true
      - name: tagline
        label: Tagline
        type: string

  hero:
    type: object
    fields:
      - name: eyebrow
        label: Eyebrow
        type: string
      - name: title
        label: Title
        type: string
        required: true
      - name: lede
        label: Lead text
        type: text
      - name: primary_cta
        label: Primary CTA
        component: cta
      - name: secondary_cta
        label: Secondary CTA
        component: cta
      - name: image
        label: Image
        type: image
        options:
          media: images
      - name: image_alt
        label: Image alt text
        type: string
      - name: photo_label
        label: Photo label
        type: string
      - name: photo_meta
        label: Photo meta
        type: string
      - name: stats
        label: Stats
        component: hero_stat
        list:
          collapsible:
            collapsed: true
            summary: "{value}"

  overview:
    type: object
    fields:
      - name: eyebrow
        label: Eyebrow
        type: string
      - name: title
        label: Title
        type: string
        required: true
      - name: text
        label: Text
        type: text

  services_section:
    type: object
    fields:
      - name: eyebrow
        label: Eyebrow
        type: string
      - name: title
        label: Title
        type: string
        required: true
      - name: text
        label: Text
        type: text
      - name: items
        label: Service items
        component: service
        list:
          collapsible:
            collapsed: true
            summary: "{title}"

  ai_solutions_section:
    type: object
    fields:
      - name: eyebrow
        label: Eyebrow
        type: string
      - name: title
        label: Title
        type: string
        required: true
      - name: intro
        label: Intro
        type: text
      - name: product
        label: Product
        type: object
        fields:
          - name: name
            label: Product name
            type: string
            required: true
          - name: tagline
            label: Product tagline
            type: string
          - name: logo
            label: Product logo
            type: image
            options:
              media: images
          - name: logo_alt
            label: Logo alt text
            type: string
          - name: image
            label: Product UI image
            type: image
            options:
              media: images
          - name: image_alt
            label: Image alt text
            type: string
          - name: description
            label: Description
            type: text
          - name: features
            label: Features
            component: ai_feature
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
          - name: page_cta_label
            label: "\"Full specifications\" button label"
            type: string
          - name: page_cta_url
            label: "\"Full specifications\" button URL"
            type: string
          - name: product_page
            label: Dedicated product page
            component: product_page

  approach:
    type: object
    fields:
      - name: eyebrow
        label: Eyebrow
        type: string
      - name: title
        label: Title
        type: string
      - name: detail_title
        label: Detail title
        type: string
      - name: highlight
        label: Highlight
        type: text
      - name: steps
        label: Steps
        component: approach_step
        list:
          collapsible:
            collapsed: true
            summary: "{number} {title}"

  team:
    type: object
    fields:
      - name: eyebrow
        label: Eyebrow
        type: string
      - name: title
        label: Title
        type: string
      - name: text
        label: Text
        type: text
      - name: members
        label: Team members
        component: team_member
        list:
          collapsible:
            collapsed: true
            summary: "{name}"

  contact:
    type: object
    fields:
      - name: eyebrow
        label: Eyebrow
        type: string
      - name: title
        label: Title
        type: string
      - name: text
        label: Text
        type: text
      - name: direct_title
        label: Direct contacts title
        type: string
      - name: people
        label: Contact people
        component: contact_person
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
      - name: form
        label: Contact form
        component: contact_form

  footer:
    type: object
    fields:
      - name: copyright
        label: Copyright
        type: string
      - name: back_to_top
        label: Back to top label
        type: string

content:
  - name: website_content
    label: Website Content
    type: group
    items:
      - name: english_content
        label: English Content
        type: file
        path: content/en.yml
        format: yaml
        fields:
          - name: language
            label: Language
            component: language
          - name: company
            label: Company
            component: company
          - name: navigation
            label: Navigation
            component: link
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
          - name: hero
            label: Hero
            component: hero
          - name: overview
            label: Overview
            component: overview
          - name: services
            label: Services
            component: services_section
          - name: ai_solutions
            label: AI Solutions
            component: ai_solutions_section
          - name: approach
            label: Approach
            component: approach
          - name: results
            label: Results (case studies + testimonials)
            component: results_section
          - name: team
            label: Team
            component: team
          - name: contact
            label: Contact
            component: contact
          - name: footer
            label: Footer
            component: footer

      - name: mongolian_content
        label: Mongolian Content
        type: file
        path: content/mn.yml
        format: yaml
        fields:
          - name: language
            label: Language
            component: language
          - name: company
            label: Company
            component: company
          - name: navigation
            label: Navigation
            component: link
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
          - name: hero
            label: Hero
            component: hero
          - name: overview
            label: Overview
            component: overview
          - name: services
            label: Services
            component: services_section
          - name: ai_solutions
            label: AI Solutions
            component: ai_solutions_section
          - name: approach
            label: Approach
            component: approach
          - name: results
            label: Results (case studies + testimonials)
            component: results_section
          - name: team
            label: Team
            component: team
          - name: contact
            label: Contact
            component: contact
          - name: footer
            label: Footer
            component: footer
