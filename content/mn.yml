      name: Ider Gerelsuren
      role: Хамтран үүсгэн байгуулагч - Цахилгаан ба автоматжуулалтын инженер
      bio: Үйлдвэрлэлийн автоматжуулалт, засвар үйлчилгээ, хөрөнгийн менежментийн 8+ жилийн туршлагатай бөгөөд PLC, хэмжүүр, DeltaV мэдлэгтэй.
      details: Дунд ба нам хүчдэлийн систем, аюулгүй байдал, үйл ажиллагааны бэлэн байдалд төвлөрдөг. ШУТИС-д Үйлдвэрлэлийн автоматжуулалтын чиглэлээр суралцсан.
    - initials: TB
      name: Tsogt Batjargal
      role: Үйлдвэрлэлийн өгөгдөл ба системийн инженер
      bio: Мэдээллийн технологи ба өгөгдлийн аналитикийн 15+ жилийн туршлагатай, багуудад нэг үнэн эх сурвалж өгөх найдвартай өгөгдлийн систем байгуулдаг.
      details: Уул уурхайн компаниудын үйлдвэрлэлийн өгөгдлийн ажиллагаа. МУИС, Toronto School of Management-ийн Data Analytics, Niagara College-ийн Computer Programming чиглэлээр суралцсан.
