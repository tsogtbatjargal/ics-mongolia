approach:
  eyebrow: Хүргэлтийн арга
  title: Танай ажиллагаанд нийцэх бодит алхмууд
  detail_title: Хэрхэн ажилладаг вэ
  highlight: Тодорхой үе шат, эрсдэлийн хяналт, үйлдвэрлэлд бэлэн туршилттай талбай дээр, алсаас эсвэл хосолсон хүргэлт.
  steps:
    - number: "01"
      title: Илрүүлэх
      summary: Үнэлгээ нь автоматжуулалтын боломжуудыг ил гаргана.
      description: Дохиоллын ачаалал, контурын төлөв, хэмжүүрийн найдвартай байдал, HMI ашиглахад хялбар эсэхийг хамарсан үнэ төлбөргүй үнэлгээ хурдан сайжруулалтыг тодорхойлно.
    - number: "02"
      title: Хүрээ тодорхойлох
      summary: Бизнесийн үндэслэлтэй шийдлийг тодорхойлж, зураглаж, баримтжуулна.
      description: "Хамрах хүрээ, P&ID, эрсдэлийн хяналт, шаталсан төлөвлөгөөг үйлдвэрлэлийн цонх ба бизнесийн үр дүнтэй тэнцвэржүүлнэ."
    - number: "03"
      title: Төлөвлөж хэрэгжүүлэх
      summary: Оновчтой удирдлагын стратегийг хамт хөгжүүлж, туршиж, нэвтрүүлнэ.
      description: Операторуудыг оролцуулан шинэчлэлийг хамт хөгжүүлж, туршиж, ашиглалтад оруулна.
    - number: "04"
      title: Дүгнэж баталгаажуулах
      summary: Гүйцэтгэлийг харьцуулж, үр дүнг баримтжуулж, мэдлэг шилжүүлнэ.
      description: Өмнөх ба дараах KPI-г харьцуулж, журмыг баталгаажуулж, мэдлэг шилжүүлснээр багууд сайжруулалтаа эзэмшинэ.
team:
  eyebrow: Манай баг
  title: Танай удирдлагын өрөөнд ажиллаж үзсэн инженерүүд
  text: Уул уурхайн төвөгтэй орчинд үр дүн гаргасан автоматжуулалт, цахилгаан, өгөгдлийн мэргэжилтнүүд.
  members:
    - initials: BL
      name: Badraa Lkhagvaa
      role: Хамтран үүсгэн байгуулагч - Автоматжуулалтын инженер
      bio: DeltaV DCS, процессын удирдлага, тасралтгүй сайжруулалтаар мэргэшсэн уул уурхай ба үйлдвэрлэлийн автоматжуулалтын 15+ жилийн туршлагатай.
