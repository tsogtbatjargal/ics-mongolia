overview:
  eyebrow: Бидний хүргэх үнэ цэн
  title: Бид үйлдвэрийн аюулгүй ажиллагаа болон бүтээмжийг автоматжуулалт болон
    удирдлагын системийн оновчлолоор хэмжигдэхүйц сайжруулж, үйл ажиллагааны
    тулгамдаж буй сорилтуудыг урт хугацааны тогтвортой өсөлт болгон хувиргадаг
  features:
    - title: Удирдлагын өрөөний тодорхой байдал
      text: ISA стандарттай нийцсэн орчин үеийн HMI, дохиоллын цэгцлэлт, ослоос
        хамгаалах журам.
      tag: Оператор эхэнд
      image: /images/control-room-clarity.jpg
      image_alt: Удирдлагын өрөөний дэлгэцүүд
    - title: Нэвтрүүлэх чадварын тохируулга
      text: Тээрэм, бутлуур, өтгөрүүлэгчийн хэлхээг тогтвортой контур ба дэвшилтэт
        удирдлагаар тогтворжуулна.
      tag: Хэлбэлзэл бага
      image: /images/ore-conveyor-system.jpg
      image_alt: Хүдрийн туузан дамжуулагч
    - title: Хэмжүүрийн тэсвэртэй ажиллагаа
      text: Тоос, чичиргээ, өвлийн хүйтэнд ажиллах сонголт, тохируулга, ашиглалтын
        мөчлөгийн дэмжлэг.
      tag: Талбайд зориулсан
      image: /images/instrumentation-resilience.jpg
      image_alt: Уурхайн хүнд нөхцөл дэх хэмжүүрийн шалгалт
services:
  eyebrow: Шийдлүүд
  title: Бид байгууллага бүрийн үйл ажиллагаанд тохирсон автоматжуулалт,
    удирдлагын систем, хиймэл оюуны шийдлүүдийг санал болгодог
  text: Бид олон улсын болон Монголын уул уурхайн салбарт ажилласан 16 гаруй
    жилийн туршлага дээр тулгуурлан үйлдвэрлэлийн салбар дахь байгууллагуудад
    шаардлагатай дэмжлэгийг түргэн шуурхай үзүүлж, найдвартай бодит үр дүнг
    санал болгохоос гадна урт хугацааны тогтвортой харилцаагаар ханган ажиллаж
    байна
  items:
