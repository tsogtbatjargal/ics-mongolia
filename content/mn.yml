overview:
  eyebrow: Бидний хүргэх үнэ цэнэ
  title: Үйлдвэрийн аюулгүй, тогтвортой, ашигтай ажиллагааг хангах автоматжуулалт.
  text: Бидний ур чадвар нь нөөц хязгаарлагдмал орчны өвөрмөц бэрхшээлүүд —
    процессын үр ашиггүй байдал, хүний нөөцийн хязгаарлалт, анзаарагдаагүй
    сайжруулах боломжууд зэргийг шийдвэрлэхэд оршдог бөгөөд ингэснээр
    үйлчлүүлэгчид хэмжигдэхүйц гүйцэтгэлийн ахиц дэвшил, зардал хэмнэлтэд
    хүрэхэд нь тусалдаг.
problems:
  eyebrow: Тулгамдсан асуудал
  title: Хиймэл оюунаар шийдэгдэх зургаан өндөр өртөгтэй асуудал
  text: Шийдэгдээгүй эдгээр асуудал тус бүр нэг үйлдвэрт жилд сая сая долларын
    алдагдал учруулдаг. Хиймэл оюун болон машин хараа эдгээр асуудлыг илүү нарийн,
    илүү найдвартай, олон дахин бага зардлаар шийдэх боломжтой болсон.
  items:
    - icon: alert
      title: Гадны биетээс үүдэх эвдрэл
      text: Гадны төмөрлөг, хэт том хэмжээтэй чулуу болон хог хаягдал нь туузан
        дамжуургын ноцтой урагдал, тоног төхөөрөмжийн эвдрэлд хүргэдэг.
      cost: Жилд $500мянга–$2сая+
    - icon: trend
      title: Нунтаглалтын хэлхээний P80 хэмжилт
      text: Хиймэл оюун нь одоо ашиглаж буй технологиос ойролцоогоор 5%-иар илүү үр дүнтэй
        ажилладаг. Нунтаглалтын хэлхээ оновчтой горимоос 3–5% зөрж ажилласнаар
        эрчим хүч үрэгдэж, хүчин чадал буурдаг.
      cost: 3–5% хүчин чадлын алдагдал
    - icon: droplet
      title: Флотацийн удирдлагын оновчгүй байдал
      text: Хөөсний бөмбөлгийн хэмжээ, хурд, бүтэц нь флотацийн удирдлагын хэлхээний гол
        үзүүлэлт боловч ихэнх үйлдвэрт эдгээрийг хэмжих хэрэгсэл байдаггүй. Камертай
        үйлдвэрүүд ч түүнийг зөвхөн ажиглалтын хэрэгсэл болгон ашигладаг эсвэл
        удирдлагын зохион байгуулалт нь оновчгүй байдаг.
      cost: 1–5% металл авалтын алдагдал
    - icon: wrench
      title: Тоног төхөөрөмжийн хяналтын завсар
      text: Операторын нүдэн баримжаат үзлэг тогтмол хийгддэг ч мөн чанараараа хомс —
        ихэвчлэн ээлжинд нэг, хоёр удаа — тул хөгжиж буй эвдрэл илрэхгүй өнгөрөх
        урт завсар үүсдэг. Машин хараа энэ завсрыг нөхнө.
      cost: Төлөвлөгөөгүй сул зогсолт
    - icon: swap
      title: Туузны урагдал ба хазайлт
      text: Туузны уртааш урагдал болон хазайлт нь ноцтой эвдрэл болтол илрэхгүй өнгөрдөг.
        Машин хараа эдгээрийг хэдхэн секундэд илрүүлнэ.
      cost: Тоног төхөөрөмжийн ноцтой эвдрэл
    - icon: boxes
      title: Овоолгын нөөцийн бүртгэлийн алдаа
      text: Бутлагдсан хүдрийн буфер, нүүрсний талбай болон баяжмалын агуулахын овоолгын
        эзэлхүүнийг үе үе гар аргаар хэмжих буюу дрон нислэгээр тодорхойлдог. Үүнээс
        болж уурхайн төлөвлөлт, логистикийн баг сая сая долларын нөөцийг хуучирсан,
        алдаатай мэдээлэл дээр тулгуурлан удирддаг.
      cost: Нөөцийн бүртгэлийн алдаа
