overview:
  eyebrow: Бидний хүргэх үнэ цэн
  title: Аюулгүй, тогтвортой, ашигтай ажиллагааг дэмжих автоматжуулалт
  text: Industrial Control Solutions LLC нь уурхайн орчинд батлагдсан удирдлагын өрөөний арга барил, найдвартай хэмжүүрийн дадал, дижитал харагдацыг нэгтгэн багуудыг аюулгүй байдлаа хадгалан нэвтрүүлэх чадвараа өсгөхөд тусалдаг.
  features:
    - title: Удирдлагын өрөөний тодорхой байдал
      text: ISA стандарттай нийцсэн орчин үеийн HMI, дохиоллын цэгцлэлт, ослоос хамгаалах журам.
      tag: Оператор эхэнд
      image: /images/control-room-clarity.jpg
      image_alt: Удирдлагын өрөөний дэлгэцүүд
    - title: Нэвтрүүлэх чадварын тохируулга
      text: Тээрэм, бутлуур, өтгөрүүлэгчийн хэлхээг тогтвортой контур ба дэвшилтэт удирдлагаар тогтворжуулна.
      tag: Хэлбэлзэл бага
      image: /images/ore-conveyor-system.jpg
      image_alt: Хүдрийн туузан дамжуулагч
    - title: Хэмжүүрийн тэсвэртэй ажиллагаа
      text: Тоос, чичиргээ, өвлийн хүйтэнд ажиллах сонголт, тохируулга, ашиглалтын мөчлөгийн дэмжлэг.
      tag: Талбайд зориулсан
      image: /images/instrumentation-resilience.jpg
      image_alt: Уурхайн хүнд нөхцөл дэх хэмжүүрийн шалгалт
services:
  eyebrow: Шийдлүүд
  title: Үйлдвэрлэлийн орчинд зориулсан бодит үйлчилгээ
  text: Шуурхай үнэлгээнээс бүрэн шинэчлэлийн хөтөлбөр хүртэл бид танай багтай хамт хэмжигдэхүйц үр дүн гаргана.
  items:
    - icon: CS
      title: Удирдлагын системийн үнэлгээ
      text: DeltaV, PLC, SCADA системд хараат бус үнэлгээ хийж үйлдвэрлэлийг хамгаалах хурдан засварын жагсаалт гаргана.
      tags:
        - Найдвартай байдал
        - Аюулгүй байдал
    - icon: OR
      title: Оновчлолын замын зураг
      text: "Бизнесийн үндэслэлтэй удирдлагын өгүүлэмж, P&ID шинэчлэл, шаталсан CAPEX/OPEX зөвлөмж."
      tags:
        - ROI эхэнд
        - Эрэмбэлсэн
    - icon: AC
      title: Дэвшилтэт удирдлагын хөгжүүлэлт
      text: PID тохируулга, APC, хамгаалалтын холбоосоор хэлхээг тогтворжуулж зогсолт ба гар ажиллагааг бууруулна.
      tags:
        - APC
        - Контур тохируулга
    - icon: AH
      title: Дохиолол ба HMI шинэчлэл
      text: ISA-18.2 дохиоллын стратеги, үүрэгт суурилсан HMI, ослоос хамгаалах ажиллагааны журам.
      tags:
        - ISA-18.2
        - Операторууд
    - icon: IL
      title: Хэмжүүрийн ашиглалтын мөчлөг
      text: Чухал мэдрэгчүүдийг зураг төслийн хязгаарт барих сонголт, тохируулга, төлөв байдлын хяналт.
      tags:
        - Калибровк
        - Талбайд бэлэн
    - icon: DP
      title: Дижитал гүйцэтгэлийн самбар
      text: Удирдлага ба супервайзеруудыг нэг эх сурвалжтай болгох өгөгдлийн урсгал, KPI самбар.
      tags:
        - OT + IT
        - Харагдац
