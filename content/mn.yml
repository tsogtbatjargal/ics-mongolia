overview:
  eyebrow: Бидний хүргэх үнэ цэнэ
  title: Үйлдвэрийн аюулгүй, тогтвортой, ашигтай ажиллагааг хангах автоматжуулалт.
  text: Бид үйлдвэрийн аюулгүй ажиллагаа болон бүтээмжийг автоматжуулалт болон
    удирдлагын системийн оновчлолоор хэмжигдэхүйц сайжруулж, үйл ажиллагааны
    тулгамдаж буй сорилтуудыг урт хугацааны тогтвортой өсөлт болгон хувиргадаг.
services:
  eyebrow: Шийдлүүд
  title: Үйлдвэрлэлийн орчинд зориулсан туршлагатай үйлчилгээ
  text: Бид байгууллага бүрийн үйл ажиллагаанд тохирсон автоматжуулалт, удирдлагын
    систем, хиймэл оюуны шийдлүүдийг санал болгодог. Олон улсын болон Монголын
    уул уурхайн салбарт ажилласан 16 гаруй жилийн туршлага дээр тулгуурлан
    үйлдвэрлэлийн салбар дахь байгууллагуудад шаардлагатай дэмжлэгийг түргэн
    шуурхай үзүүлж, найдвартай бодит үр дүнг санал болгохоос гадна урт хугацааны
    тогтвортой харилцаагаар ханган ажиллаж байна.
  items:
    - icon: CS
      title: Удирдлагын системийн оновчлол
      text: DeltaV, PLC болон SCADA системийн хараат бус үнэлгээ хийж, үйлдвэрлэлийг
        хамгаалах эрэмбэлсэн засварын төлөвлөгөө боловсруулна.
      tags:
        - Найдвартай байдал
        - Аюулгүй байдал
    - icon: PC
      title: Үйлдвэрлэлийн процессын удирдлагын логик боловсруулах
      text: Бизнесийн үндэслэлтэй удирдлагын өгүүлэмж, P&ID шинэчлэл, шаталсан
        CAPEX/OPEX зөвлөмж.
      tags:
        - ROI эхэнд
        - Эрэмбэлсэн
    - icon: AC
      title: PID контроллёрын тохируулга ба процессын тогтвортой байдлыг сайжруулах
      text: PID тохируулга, APC, хамгаалалтын холбоосоор хэлхээг тогтворжуулж зогсолт
        ба гар ажиллагааг бууруулна.
      tags:
        - APC
        - Контур тохируулга
    - icon: AH
      title: Дохиолол ба HMI шинэчлэл
      text: ISA-18.2 дохиоллын стратеги, үүрэгт суурилсан HMI, ослоос хамгаалах
        ажиллагааны журам.
      tags:
        - ISA-18.2
        - Операторууд
    - icon: IL
      title: Хэмжүүрийн ашиглалтын мөчлөг
      text: Чухал мэдрэгчүүдийг зураг төслийн хязгаарт барих сонголт, тохируулга,
        төлөв байдлын хяналт.
      tags:
        - Калибровк
        - Талбайд бэлэн
    - icon: DP
      title: Дижитал гүйцэтгэлийн самбар
      text: Удирдлага ба супервайзеруудыг нэг эх сурвалжтай болгох өгөгдлийн урсгал,
        KPI самбар.
      tags:
        - OT + IT
        - Харагдац
ai_solutions:
  eyebrow: Хиймэл оюуны шийдлүүд
  title: Уул уурхайд зориулсан хиймэл оюунт машин харааны шийдлүүд
  intro: Бид уул уурхайн үйл ажиллагаанд аюулгүй байдлыг сайжруулж, зогсолтын
    хугацааг багасгаж, бүтээмжийг нэмэгдүүлэх хиймэл оюунт машин харааны
    шийдлүүдийг хөгжүүлдэг. Бидний хиймэл оюуны загварууд нь уул уурхайн өгөгдөл
    дээр сургагдсан бөгөөд манай бүтээгдэхүүнүүд нь уул уурхайн хүнд нөхцөлд
    ажиллахад зориулагдсан.
  product:
    name: ICS-FOD
    tagline: Гадны биет илрүүлэх систем
    logo: /images/ics-fod-logo.png
    logo_alt: ICS-FOD лого
    image: /images/ics-fod-product.png
    image_alt: ICS-FOD гадны биет илрүүлэх системийн хэрэглэгчийн интерфэйс
    description: ICS-FOD нь туузан дамжуурга дээрх гадны биетийг хүний оролцоогүй
      илрүүлэх хиймэл оюунд суурилсан хяналтын систем юм. ICS-FOD систем нь
      аюултай гадны биетийг илрүүлж, эвдрэл гэмтэл учрахаас өмнө операторт
      мэдээлэх эсвэл туузан дамжуургыг зогсоох хүртэл шаардлагатай арга хэмжээг
      авдаг. Ингэснээр өртөг ихтэй тоног төхөөрөмжийн эвдрэл гэмтэл болон
      төлөвлөөгүй зогсолтоос урьдчилан сэргийлэх боломжтой юм.
    features:
      - title: Хиймэл оюунд суурилсан технологи
        text: Уламжлалт метал илрүүлэгч илрүүлж чаддаггүй метал биет болон хөлдсөн хүдэр
          гэх мэт хэт том биетийг илрүүлдэг.
      - title: < 1 секунд
        text: Гадны биет камерын харах талбарт орсноос илрүүлэн түгшүүрийн дохио өгөх
          хүртэл хугацаа 1 секундээс бага байна.
      - title: 24 / 7 хяналт
        text: Оператор болон хүний оролцооноос хараат бус бие даан ажилладаг.
approach:
  eyebrow: Хүргэлтийн арга
  title: Танай ажиллагаанд нийцэх бодит алхмууд
  detail_title: Хэрхэн ажилладаг вэ
  highlight: Тодорхой үе шат, эрсдэлийн хяналт, үйлдвэрлэлд бэлэн туршилттай
    талбай дээр, алсаас эсвэл хосолсон хүргэлт.
  steps:
    - number: "01"
      title: Илрүүлэх
      summary: Үнэлгээ нь автоматжуулалтын боломжуудыг ил гаргана.
      description: Дохиоллын ачаалал, контурын төлөв, хэмжүүрийн найдвартай байдал,
        HMI ашиглахад хялбар эсэхийг хамарсан үнэ төлбөргүй үнэлгээ хурдан
        сайжруулалтыг тодорхойлно.
    - number: "02"
      title: Хүрээ тодорхойлох
      summary: Бизнесийн үндэслэлтэй шийдлийг тодорхойлж, зураглаж, баримтжуулна.
      description: Хамрах хүрээ, P&ID, эрсдэлийн хяналт, шаталсан төлөвлөгөөг
        үйлдвэрлэлийн цонх ба бизнесийн үр дүнтэй тэнцвэржүүлнэ.
    - number: "03"
      title: Төлөвлөж хэрэгжүүлэх
      summary: Оновчтой удирдлагын стратегийг хамт хөгжүүлж, туршиж, нэвтрүүлнэ.
      description: Операторуудыг оролцуулан шинэчлэлийг хамт хөгжүүлж, туршиж,
        ашиглалтад оруулна.
    - number: "04"
      title: Дүгнэж баталгаажуулах
      summary: Гүйцэтгэлийг харьцуулж, үр дүнг баримтжуулж, мэдлэг шилжүүлнэ.
      description: Өмнөх ба дараах KPI-г харьцуулж, журмыг баталгаажуулж, мэдлэг
        шилжүүлснээр багууд сайжруулалтаа эзэмшинэ.
team:
  eyebrow: Манай баг
  title: Уул уурхай, автоматжуулалтын салбарт 16+ жилийн туршлагатай үйлдвэрлэлийн
    автоматжуулалт, цахилгаан, хиймэл оюун болон өгөгдөлийн мэргэшсэн инженерийн
    баг.
  text: Монголын үйлдвэрлэлийн салбарт үр дүн гаргасан автоматжуулалт, цахилгаан,
    хиймэл оюун, өгөгдлийн мэргэжилтнүүд.
  members:
    - initials: BL
      name: Лхагваагийн Бадраа
      role: Үүсгэн байгуулагч — Автоматжуулалтын инженер
      bio: Уул уурхай, үйлдвэрлэлийн автоматжуулалтын салбарт 16 жилийн туршлагатай
        автоматжуулалтын мэргэжилтэн. Emerson DeltaV DCS удирдлагын систем,
        Metso OCS 4-D ахисан төвшний удирдлагын систем, Aveva PI мэдээллийн бааз
        систем, процессийн хяналт, тасралтгүй сайжруулалтын чиглэлээр мэргэшсэн.
      details: Өмнө нь Оюу Толгой (Монгол) болон Kennecott Utah Copper (АНУ) уурхайн
        автоматжуулалтын систем ба оновчлолын төслүүдийг хэрэгжүүлж, удирдаж
        ажилласан. ОХУ-ын Уралын Уул Уурхайн Их Сургуулийг "Технологийн процесс
        ба үйлдвэрлэлийн автоматжуулалт" мэргэжлээр төгссөн.
    - initials: IG
      name: Гэрэлсүрэнгийн Идэр
      role: Үүсгэн байгуулагч — Цахилгаан ба автоматжуулалтын инженер
      bio: Баяжуулах үйлдвэрийн засвар, найдвартай ажиллагаа, автоматжуулалтын
        чиглэлээр 8 гаруй жилийн туршлагатай. Нам/дунд хүчдэлийн систем, PLC
        програмчлал, хэмжүүр, DeltaV удирдлагын системийн эксперт.
      details: CAPEX сайжруулалт, хөрөнгийн менежмент, тоног төхөөрөмжийн
        үйлдвэрлэгчидтэй OEM хамтын ажиллагаагаар тоног төхөөрөмжийн найдвартай
        ажиллагааг сайжруулж, зогсолтыг бууруулсан туршлагатай. ШУТИС-ийг
        "Үйлдвэрийн автоматжуулалт" мэргэжлээр төгссөн.
    - initials: TB
      name: Батжаргалын Цогт
      role: Өгөгдөл ба програм хангамжийн инженер (Зайнаас ажилладаг)
      bio: Өгөгдлийн шугам ба ETL процессийн боловсруулалт, арчилгаанд туршлагатай.
        Python, SQL, C# хэлээр чадварлаг, өгөгдлийн загварчлал, шинжилгээ,
        дүрслэлд туршлагатай. Хүнд өгөгдөл интеграц хийх, техникийн болон
        техникийн бус талуудад ойлгомжтой тайлагнах чадвартай.
      details: Монгол Улсын Их Сургуулийн Микроконтроллерийн програмчлал, Торонто
        Менежментийн Сургуулийн Өгөгдлийн шинжилгээ, Найагара Коллежийн
        Компьютерийн програмчлал мэргэжлийг тус тус эзэмшсэн.
    - initials: ZT
      name: Туяагийн Зулхүү
      role: AI болон Computer Vision инженер
      bio: Робот техник, 3D хараа, мэдрэгчийн калибровк, embedded систем болон машин
        сургалтын чиглэлээр 10 гаруй жилийн туршлагатай AI болон computer vision
        инженер. Ажлын хүрээ нь 3D сэргээн байгуулалт, олон мэдрэгчийн бүртгэл
        ба уялдуулалт, ROS-д суурилсан робот техник, байршил тогтоолт, embedded
        vision оновчлол, зураг болон видео боловсруулалтыг хамардаг.
      details: Sony, Kailas Robotics болон стартап компаниудад ажилласан туршлагатай
        тэрээр камеруудыг бодит ертөнцийг харах, ойлгох, хэмжих чадвартай болгох
        гүнзгий техникийн мэдлэг, ур чадварыг эзэмшсэн.
