    - initials: TB
      name: Батжаргалын Цогт
      role: Үйлдвэрлэлийн өгөгдөл ба системийн инженер
      bio: Мэдээллийн технологи ба өгөгдлийн аналитикийн 15+ жилийн туршлагатай,
