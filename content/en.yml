overview:
  eyebrow: What we deliver
  title: Automation that keeps your operation safe, stable, and profitable
  text: Industrial Control Solutions LLC brings mine-proven control room thinking,
    robust instrumentation practices, and digital visibility so crews can push
    throughput without trading away safety.
  features:
    - title: Control room clarity
      text: Modern HMI, alarm rationalization, and incident-proof procedures aligned
        to ISA standards.
      tag: Operators first
      image: /images/control-room-clarity.jpg
      image_alt: Control room dashboards
    - title: Throughput tuning
      text: Stabilize mills, crushers, and thickener circuits with robust loops and
        advanced controls.
      tag: Less variability
      image: /images/ore-conveyor-system.jpg
      image_alt: Ore conveyor system
    - title: Instrumentation resilience
      text: Selection, calibration, and lifecycle support that stand up to dust,
        vibration, and winter cold.
      tag: Built for site
      image: /images/instrumentation-resilience.jpg
      image_alt: Instrumentation checks in harsh mining conditions
services:
  eyebrow: Solutions
  title: Hands-on services built for production environments
  text: From fast assessments to full modernization programs, we execute alongside
    your crews to land measurable improvements.
  items:
    - icon: CS
      title: Control system assessments
      text: Independent reviews of DeltaV, PLC, and SCADA with a fast list of fixes
        that protect production.
      tags:
        - Reliability
        - Safety
    - icon: OR
      title: Optimization roadmaps
      text: Control narratives, P&ID updates, and phased CAPEX/OPEX recommendations
        backed by business cases.
      tags:
        - ROI-first
        - Prioritized
    - icon: AC
      title: Advanced control development
      text: PID tuning, APC, and interlocks that stabilize circuits, cut downtime, and
        reduce manual intervention.
      tags:
        - APC
        - Loop tuning
    - icon: AH
      title: Alarm & HMI modernization
      text: ISA-18.2 alarm strategies, role-based HMI, and incident-proof operating
        procedures.
      tags:
        - ISA-18.2
        - Operators
    - icon: IL
      title: Instrumentation lifecycle
      text: Selection, calibration, and condition monitoring to keep critical sensors
        within design limits.
      tags:
        - Calibration
        - Field-ready
    - icon: DP
      title: Digital performance dashboards
      text: Data pipelines and KPI dashboards that give supervisors and leadership the
        same source of truth.
      tags:
        - OT + IT
        - Visibility
