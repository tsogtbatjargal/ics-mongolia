services:
  eyebrow: Solutions
  title: Hands-on services built for production environments
  text: We provide tailored automation, control, instrumentation, AI and digital
    solutions that fit each operation's unique environment. With 16+ years of
    hands-on experience in global mining and industrial operations, we combine
    international best practices with local expertise — delivering rapid
    response, long-term support, and tangible results across Mongolia's
    industrial sector.
  items:
    - icon: CS
      title: Control system optimization
      text: Independent reviews of DeltaV, PLC, and SCADA with a prioritized list
        of fixes that protect production.
