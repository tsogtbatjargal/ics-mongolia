  title: Hands-on services built for production environments
  text: We provide tailored automation, control, instrumentation, AI and digital
    solutions that fit each operation's unique environment. With 16+ years of
    hands-on experience in global mining and industrial operations, we combine
    international best practices with local expertise — delivering rapid
    response, long-term support, and tangible results across Mongolia's
    industrial sector.
  items:
    - icon: CS
      title: Control system optimization
      text: Independent reviews of DeltaV, PLC, and SCADA with a prioritized list of
        fixes that protect production.
      tags:
        - Reliability
        - Safety
    - icon: PC
      title: Process control logic development
      text: Control narratives, P&ID updates, and phased CAPEX/OPEX recommendations
        backed by business cases.
      tags:
        - ROI-first
        - Prioritized
    - icon: AC
      title: PID controller optimization & process stabilization
      text: PID tuning, APC, and interlocks that stabilize circuits, cut downtime, and
        reduce manual intervention.
      tags:
        - APC
        - Loop tuning
    - icon: AH
      title: Alarm & HMI modernization
      text: ISA-18.2 alarm strategies, role-based HMI, and incident-proof operating
        procedures.
      tags:
