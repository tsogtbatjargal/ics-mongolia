overview:
  eyebrow: What we deliver
  title: Automation that keeps your operation safe, stable, and profitable.
  text: Our expertise lies in addressing the unique challenges of resource-limited
    environments — process inefficiencies, workforce constraints, and overlooked
    improvement areas — helping clients achieve measurable performance gains and
    cost reductions.
problems:
  eyebrow: The challenge
  title: Six costly problems — solved by AI
  text: Each unsolved problem represents millions in annual losses for a single
    operation. AI and computer vision can now solve these problems — more
    accurately, more reliably, and at a fraction of the cost.
  items:
    - icon: alert
      title: Foreign Object Damage
      text: Tramp metal, oversize rock, and debris cause catastrophic belt tears and
        equipment failure.
      cost: $500K–$2M+ per year
    - icon: trend
      title: Grinding circuit P80 measurement
      text: AI performs better than existing technology by roughly 5%. Grinding circuits
        run 3–5% off optimal, wasting energy and reducing throughput.
      cost: 3–5% throughput loss
    - icon: droplet
      title: Sub-optimal flotation control
      text: Froth bubble size, velocity, and texture are key inputs for the flotation
        control circuit, yet most operations have no tools to measure them. Others
        have cameras but treat them as observation tools only, or their control
        design is sub-optimal.
      cost: 1–5% recovery loss
    - icon: wrench
      title: Equipment monitoring gaps
      text: Operator visual inspections are done regularly but are infrequent by nature —
        typically once or twice per shift — leaving long gaps where developing
        faults go undetected. Visual AI fills this gap.
      cost: Unplanned downtime
    - icon: swap
      title: Belt rip & mis-tracking
      text: Longitudinal belt rips and mis-tracking go undetected until catastrophic
        damage occurs. Vision catches these within seconds.
      cost: Catastrophic equipment failure
    - icon: boxes
      title: Inaccurate stockpile inventory
      text: Stockpile volumes at crushed ore buffers, coal yards, and concentrate storage
        areas are measured by periodic manual surveys or drone flights. Mine
        planners and logistics teams end up managing millions of dollars of
        inventory with stale, inaccurate data.
      cost: Inaccurate inventory management
